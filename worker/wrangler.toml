# The campaign server.
#
# Deploying is a few commands, and none of them needs Node on your own machine
# if you let GitHub Actions do it - see MAINTAINING.md.
#
#   wrangler d1 create antaera-sheets          # once, then paste the id below
#   wrangler d1 migrations apply antaera-sheets --remote --config worker/wrangler.toml
#   wrangler deploy --config worker/wrangler.toml

name = "antaera-sheets"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "antaera-sheets"
database_id = "PASTE-THE-DATABASE-ID-HERE"
migrations_dir = "migrations"

[vars]
# Where the sheets are served from. The Worker only answers this origin (and
# localhost, for development), and sends players back here after sign-in.
SITE_ORIGIN = "https://dndantaera.github.io"
SITE_PATH = "/sheets/"

# Who runs the Antaera campaign. A GM sees and edits every Antaera character
# (never anyone's SRD characters) and is the only one who can move the gestalt
# switch. Either list is enough; an account is a GM if any of its sign-ins match.
GM_DISCORD_IDS = ""        # Discord user ids, comma separated
GM_GOOGLE_EMAILS = ""      # Google account emails, comma separated

# Secrets, not vars. Set whichever providers you use; a provider with no
# secrets simply does not appear on the sign-in menu.
#   wrangler secret put DISCORD_CLIENT_ID --config worker/wrangler.toml
#   wrangler secret put DISCORD_CLIENT_SECRET --config worker/wrangler.toml
#   wrangler secret put GOOGLE_CLIENT_ID --config worker/wrangler.toml
#   wrangler secret put GOOGLE_CLIENT_SECRET --config worker/wrangler.toml
