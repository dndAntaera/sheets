name: Test and deploy the sheets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The engine's arithmetic and the housekeeping sweep, on every push. Neither
  # needs dependencies - node:test and the data files; Python's standard
  # library - so there is nothing to install.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - name: Housekeeping sweep
        run: python3 scripts/sweep.py

  # What GitHub Pages publishes is web/ alone: the sheet, the engine and the
  # data. The tests and the Worker are not part of the site.
  build:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The campaign server, deployed only when the account is configured. Without
  # CLOUDFLARE_API_TOKEN in the repository secrets this job skips, and the app
  # goes on working as a local-only build.
  worker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Is Cloudflare configured?
        id: check
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Deploy the Worker
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler 4: the Worker imports the rulesets' JSON with import attributes.
          wranglerVersion: '4'
          # Migrations first: the Worker expects the tables they create.
          command: |
            d1 migrations apply antaera-sheets --remote --config worker/wrangler.toml
            deploy --config worker/wrangler.toml
      # Sign-in secrets may be kept in this repository's Actions secrets instead
      # of the Cloudflare dashboard. Any of these that is set here is sent to the
      # Worker on every deploy; any that is not is left as the Worker has it.
      - name: Send sign-in secrets to the Worker
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_GOOGLE_EMAILS: ${{ secrets.ADMIN_GOOGLE_EMAILS }}
          GM_GOOGLE_EMAILS: ${{ secrets.GM_GOOGLE_EMAILS }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          names='["GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","ADMIN_GOOGLE_EMAILS","GM_GOOGLE_EMAILS","DISCORD_CLIENT_ID","DISCORD_CLIENT_SECRET"]'
          file="$RUNNER_TEMP/worker-secrets.json"
          jq -n --argjson names "$names" '$ENV | with_entries(select((.key | IN($names[])) and (.value | length > 0)))' > "$file"
          if [ "$(jq length "$file")" -eq 0 ]; then
            echo "No sign-in secrets in this repository; the Worker keeps its own."
          else
            echo "Sending: $(jq -r 'keys | join(", ")' "$file")"
            npx --yes wrangler@4 secret bulk "$file" --config worker/wrangler.toml
          fi
          rm -f "$file"
      - name: Say why it was skipped
        if: steps.check.outputs.ready != 'true'
        run: echo "No CLOUDFLARE_API_TOKEN secret, so the Worker was not deployed. See MAINTAINING.md."
